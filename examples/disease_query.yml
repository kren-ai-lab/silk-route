schema_version: "workflow-v1"

dataset:
  name: uniprot_breast_cancer_proteins
  description: Protein records associated with breast cancer annotations in UniProt.
  modality: protein
  mode: query_first
  primary_data_source: uniprot

query:
  value: "cc_disease:breast cancer AND reviewed:true"
  description: Retrieve reviewed UniProt protein entries associated with breast cancer disease annotations.
  filtering_strategy: >
    Disease filtering is encoded directly in the UniProt-compatible query string
    using the cc_disease field. The reviewed:true clause restricts results to
    reviewed Swiss-Prot entries.

resources:
  primary:
    - uniprot
  integration: []

execution:
  enrich: false
  max_workers: 5
  total_retries: 3
  merge_results: false

harmonization:
  id_column: "_id"
  label_column: null
  sequence_column: "sequence"
  metadata_fields:
    - accession
    - protein_name
    - gene_primary
    - organism_name
    - sequence
    - diseases

export:
  output_dir: "results/uniprot_breast_cancer_proteins"
  format: csv
  include_metadata: true
  include_summary: true
  manifest_file: "metadata.json"
  summary_file: "run_summary.yml"

reporting:
  workflow_execution_time_seconds: null
  retrieved_records: null
  unique_sequences: null
  notes: >
    Disease annotations are parsed from structured UniProt DISEASE comments
    when the response includes disease objects.
