schema_version: "workflow-v1"

dataset:
  name: protein_query_composition_labels
  description: Protein query-composition workflow with labeled UniProt queries.
  modality: protein
  mode: query_composition
  primary_data_source: uniprot

query:
  value: "keywords:antiviral protein=antiviral,go:dna repair=dna_repair"
  description: Execute two labeled UniProt-compatible protein queries.
  filtering_strategy: >
    query.value contains executable comma-separated query=label pairs.
    query.composition below is preserved metadata and does not replace
    query.value.
  composition:
    - label: antiviral
      value: "keywords:antiviral protein"
      description: Antiviral protein keyword query.
    - label: dna_repair
      value: "go:dna repair"
      description: DNA repair Gene Ontology query.

execution:
  enrich: false
  max_workers: 2
  total_retries: 1
  debug: false

harmonization:
  id_column: "_id"

export:
  output_dir: "examples/results/protein_query_composition_labels"
  format: csv
  include_metadata: true
  include_summary: true
  manifest_file: "metadata.json"
  summary_file: "run_summary.yml"
