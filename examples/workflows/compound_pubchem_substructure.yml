schema_version: "workflow-v1"

dataset:
  name: pubchem_structure_example
  description: Conservative PubChem substructure search example.
  modality: compound
  mode: query_first
  primary_data_source: pubchem

query:
  value: 'pubchem.structure:smiles_substructure="c1ccccc1"'
  description: Search for a benzene-ring substructure and export normalized properties.

execution:
  enrich: false
  max_workers: 2
  total_retries: 1
  debug: false

export:
  output_dir: "examples/results/pubchem_structure_example"
  format: csv
  include_metadata: true
  include_summary: true
  manifest_file: "metadata.json"
  summary_file: "run_summary.yml"
