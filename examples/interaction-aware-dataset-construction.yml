dataset:
  name: interaction_aware_protein_dataset
  description: Protein dataset enriched with protein-protein interaction metadata from STRING and BioGRID.
  modality: interaction
  mode: query_first
  interaction_type: protein-protein
  primary_data_source: uniprot

query:
  value: "cc_disease:DI-02663 AND reviewed:true"
  description: Retrieve reviewed UniProt proteins associated with prostate cancer and collect interaction evidence.
  filtering_strategy: >
    The primary filtering step is encoded as a UniProt-compatible disease query.
    Matching UniProt records provide protein and gene identifiers that are used
    to retrieve protein-protein interaction metadata from STRING and BioGRID.

resources:
  primary:
    - uniprot
  integration:
    - string
    - biogrid

execution:
  enrich: true
  max_workers: 5
  total_retries: 3
  merge_results: false

harmonization:
  id_column: "_id"
  label_column: null
  sequence_column: "sequence"
  metadata_fields:
    - accession
    - protein_name
    - gene_primary
    - organism
    - organism_id
    - sequence
    - diseases
    - string_ids
    - biogrid_ids

export:
  output_dir: "results/interaction_aware_protein_dataset"
  format: csv
  include_metadata: true
  include_summary: true
  manifest_file: "metadata.json"
  summary_file: "run_summary.yml"

reporting:
  workflow_execution_time_seconds: null
  retrieved_records: null
  interaction_records:
    string: null
    biogrid: null
  notes: >
    Reporting values are filled after execution from the generated result files
    and metadata manifest.
