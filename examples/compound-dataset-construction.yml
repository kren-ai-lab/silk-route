dataset:
  name: chembl_ic50_activity_composition
  description: Compound bioactivity dataset grouped by IC50 potency ranges using ChEMBL activity records.
  modality: compound
  mode: query_composition
  primary_data_source: chembl

query:
  value: "ic50:0-10=very_high_potency,ic50:10-100=high_potency,ic50:100-1000=moderate_potency"
  description: Retrieve ChEMBL IC50 activity records grouped into labeled potency ranges.
  filtering_strategy: >
    Query composition is used to execute multiple IC50 range queries. Each query
    is assigned a label that is propagated to the exported records. The IC50
    macro is resolved to ChEMBL activity records with standard_type equal to IC50
    and standard_value constrained to the requested numeric range.

resources:
  primary:
    - chembl
  integration:
    - uniprot

execution:
  enrich: true
  max_workers: 5
  total_retries: 3
  merge_results: false

harmonization:
  id_column: "_id"
  label_column: "_label"
  sequence_column: "sequence"
  metadata_fields:
    - molecule_chembl_id
    - target_chembl_id
    - assay_chembl_id
    - standard_type
    - standard_value
    - standard_units
    - canonical_smiles
    - target_pref_name
    - target_organism
    - uniprot_accession
    - protein_name
    - sequence

export:
  output_dir: "results/compound_ic50_composition"
  format: csv
  include_metadata: true
  include_summary: true
  manifest_file: "metadata.json"
  summary_file: "run_summary.yml"

reporting:
  workflow_execution_time_seconds: null
  retrieved_records: null
  unique_compounds: null
  unique_targets: null
  unique_sequences: null
  notes: >
    IC50 ranges are used as labeled query-composition groups. Lower IC50 values
    indicate higher apparent compound potency. Reporting values are filled after
    execution from exported result files and metadata.