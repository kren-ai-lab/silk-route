#:schema https://www.schemastore.org/prek.json

exclude = "^.idea/"

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"
hooks = [
  { id = "check-yaml" },
  { id = "check-toml" },
  { id = "end-of-file-fixer" },
  { id = "trailing-whitespace" }
]

[[repos]]
repo = "local"
hooks = [
  {
    id = "format",
    name = "lint-check",
    entry = "uv run task format",
    language = "system",
    pass_filenames = false
  },
  {
    id = "lint",
    name = "lint-check",
    entry = "uv run task lint",
    language = "system",
    pass_filenames = false
  }
  # ty and pyrefly are intentionally NOT blocking hooks yet: the legacy code has
  # ~223 ty diagnostics and 1 pyrefly error (the interpro query_usage bug). They
  # remain available as `uv run task ty` / `uv run task pyrefly`. Re-enable as
  # blocking hooks during the dedicated typing pass (pyrefly after Phase 2 fixes
  # interpro; ty once annotations are added).
]
