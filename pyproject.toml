[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "silkroute"
dynamic = ["version"]
description = "Tool to download and integrate biological data from multiple APIs (UniProt, AlphaFold, BioGRID, KEGG, etc.)"
readme = "README.md"
license = "MIT"
authors = [{ name = "Kren AI Lab", email = "krenai@umag.cl" }]
requires-python = ">=3.11,<3.15"

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    "polars>=1.20,<2.0",
    "biopython>=1.83,<2.0",
    "zeep>=4.3,<5.0",
    "python-dotenv>=1.0,<2.0",
    "pyyaml>=6.0.2,<7.0",
    "typer>=0.26,<1.0",
    "dicttoxml>=1.7,<2.0",
    "platformdirs>=4.0,<5.0",
    "niquests>=3.19,<4.0",
]

[project.optional-dependencies]
gui = [
    "nicegui>=3.0,<4.0",
]

[dependency-groups]
dev = [
    "niquests-mock>=0.4,<0.5",
    "pyrefly>=1.0,<2.0",
    "pytest>=9.0,<10.0",
    "pytest-cov>=7.1,<8.0",
    "ruff>=0.16,<0.17",
    "taskipy>=1.14,<2.0",
    "ty>=0.0.30,<0.1",
]

[project.scripts]
silkroute = "silkroute.cli.main:app"
silkroute-gui = "silkroute.gui.nicegui_app:main"

[project.urls]
Homepage = "https://github.com/kren-ai-lab/silk-route"
Issues = "https://github.com/kren-ai-lab/silk-route/issues"

[tool.hatch.version]
path = "silkroute/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["silkroute"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",
    "D203",
    "D213",
    "N802",
    "N803",
    "N806",
    # Argument count (PLR0913 total / PLR0917 positional): interface `fetch`/`parse` and
    # workflow `run_*` signatures are wide by design (query + per-DB options + format
    # flags). Same rationale as FBT001/FBT002 — narrowing them is a breaking API change.
    "PLR0913",
    "PLR0917",
    # ANN401 (Any): load-bearing for the generic-interface design — ~82 `**kwargs: Any`
    # passthroughs plus dynamic JSON `data`, yaml-loader returns, and generic helpers.
    # Cleanly-typeable sites have been narrowed (to concrete types / `object`); the rest
    # are intentionally Any. Kept ignored as a deliberate deviation (cf. FBT, TD003).
    "ANN401",
    # Boolean positional flags: `parse` is an established positional public-API flag on
    # fetch_single/fetch_batch (query, parse=False, *args, **kwargs) across base + all
    # interfaces; making it keyword-only is a breaking signature change. Kept intentionally.
    "FBT001", "FBT002",
    # TODO hygiene: author + colon enforced (TD002/TD004). TD003 (issue link)
    # and FIX002 (presence) kept ignored — TODOs are intentional, no issue-link workflow.
    "TD003", "FIX002",
    # Complexity (C901/PLR0911/PLR0912/PLR0915): the worst offenders have been
    # decomposed (CLI export helpers, PubChemInterface.fetch). The rest are
    # inherently-branchy method/format dispatchers (fetch/parse routing by
    # method+option+format, CLI run() commands); kept ignored as accepted complexity.
    "C901",
    "PLR0911",
    "PLR0912",
    "PLR0915",
    "CPY001",
    # PEP 695 type-parameter syntax (`def f[T]()` / `class C[T]`): ruff targets py312 but
    # requires-python is >=3.11, where that syntax is a SyntaxError. Generics must keep
    # using `TypeVar`, so these upgrade rules are unsatisfiable here.
    "UP046",
    "UP047",
]

[tool.ruff.lint.per-file-ignores]
"silkroute/cli/*" = [
    "B008", # typer.Option() in function defaults is the intended pattern
    "FBT001", # bool flags are standard in CLI functions
    "FBT002",
    "FBT003",
    "TC003", # Path used at runtime by typer for type coercion
    "T201", # CLI commands print user-facing output
]
"silkroute/init_config.py" = ["T201"]  # init script prints setup progress
"tests/*" = [
    "ANN",
    "ARG001", # unused fixture/mock arguments are common in tests
    "ARG002", # unused mock-method arguments are common in tests
    "ARG005", # unused lambda args in monkeypatch stubs are common in tests
    "D",
    "EM101",
    "FBT003",
    "PLC0415",
    "PLR2004",
    "PT011",
    "PT017",
    "RUF012", # contract-mixin class attrs (QUERY/CALL_KWARGS dicts) are fixed test data
    "S101",
    "SLF001", # tests legitimately exercise private members
    "TRY003",
]
"examples/*" = [
    "ARG002", # template stubs declare interface args they don't use
    "INP001", # example scripts are intentionally standalone modules
    "PLR2004", # small referential scripts can compare against literal sizes
    "S101", # lightweight runtime checks are fine in examples
    "S603", # subprocess usage is explicit in CLI examples
    "T201", # examples print result snippets by design
]

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]

[tool.taskipy.tasks]
sort-imports = "ruff check --fix --select I,F401 silkroute/ tests/ examples/"
format = "task sort-imports && ruff format silkroute/ tests/ examples/"
lint = "ruff check silkroute/ tests/ examples/"
lint-fix = "ruff check --fix silkroute/ tests/ examples/"
ty = "ty check silkroute/ tests/"
pyrefly = "pyrefly check silkroute/ tests/"
test = "pytest -q"
test-v = "pytest -v"
test-cov = "pytest --cov=silkroute --cov-report=html"
update-fixtures = "SILKROUTE_CAPTURE=1 python -m tests._capture.capture"
