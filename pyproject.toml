[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bioseqdownloader"
dynamic = ["version"]
description = "Tool to download and integrate biological data from multiple APIs (UniProt, AlphaFold, BioGRID, KEGG, etc.)"
readme = "README.md"
license = "GPL-3.0-only"
authors = [{ name = "Kren AI Lab", email = "krenai@umag.cl" }]
requires-python = ">=3.11,<3.15"

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    "pandas",
    "pyarrow",
    "requests",
    "biopython",
    "zeep",
    "python-dotenv",
    "pyyaml",
    "typer",
    "dicttoxml",
    "platformdirs>=4.0,<5.0",
]

[project.optional-dependencies]
dev = [
    "pyrefly>=0.64",
    "ruff>=0.15",
    "taskipy>=1.14",
    "ty>=0.0.30",
]
tests = [
    "pytest>=9.0",
    "pytest-cov>=7.1",
    "responses>=0.25",
]

[project.scripts]
bioseq-dl = "bioseq_dl.cli.main:app"

[project.urls]
Homepage = "https://github.com/ProteinEngineering-PESB2/BioSeqDownloader"
Issues = "https://github.com/ProteinEngineering-PESB2/BioSeqDownloader/issues"

[tool.hatch.version]
path = "bioseq_dl/__init__.py"
pattern = '__version__ = "(?P<version>[^"]+)"'

[tool.hatch.build.targets.wheel]
packages = ["bioseq_dl"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # --- Group defaults (shared with roxy/sylphy) ---
    "COM812",
    "D203",
    "D213",
    "N802",
    "N803",
    "N806",
    "PLR0913",

    # --- Transitional: legacy style/docs/typing, not enforced yet ---
    # ANN401 (Any type): intentional for passthrough **kwargs and dynamic JSON API responses
    "ANN401",
    # Logging string style (f-strings in log calls are pervasive and acceptable here)
    "G003", "G004",
    # Deliberate error-handling style: TRY301 (validate-then-convert-to-Exit) and
    # BLE001 (top-level CLI / best-effort catch-alls) are intentional here.
    "TRY301",
    # Boolean flags (common in this API surface; CLI also relies on them)
    "FBT001", "FBT002",
    # Unused args (interface-contract signatures)
    "ARG001", "ARG002", "ARG005",
    # TODO formatting / presence
    "TD002", "TD003", "TD004", "FIX002",
    # Misc legacy style
    "E501", "SLF001",
    "S110",
    # Complexity / size (deferred to Phase 3 refactor)
    "PLR0911", "PLR0915",

    # --- Transitional: REAL findings deferred to Phase 2/3 (remove as fixed) ---
    "BLE001",   # blind except: intentional CLI/defensive catch-alls (see note above)
    "C901",     # complexity: Phase 3 (split base.py / fetch_single)
    "PLR0912",  # too many branches: Phase 3
    "RUF012",   # mutable ClassVar default (Phase 3 base refactor)
]

[tool.ruff.lint.per-file-ignores]
"bioseq_dl/cli/*" = [
    "B008",    # typer.Option() in function defaults is the intended pattern
    "FBT001",  # bool flags are standard in CLI functions
    "FBT002",
    "FBT003",
    "TC003",   # Path used at runtime by typer for type coercion
    "T201",    # CLI commands print user-facing output
]
"bioseq_dl/init_config.py" = ["T201"]  # init script prints setup progress
"tests/*" = [
    "ANN",
    "D",
    "EM101",
    "FBT003",
    "PLC0415",
    "PLR2004",
    "PT011",
    "PT017",
    "S101",
    "TRY003",
]
"examples/*" = [
    "INP001",  # example scripts are intentionally standalone modules
    "PLR2004", # small referential scripts can compare against literal sizes
    "S101",    # lightweight runtime checks are fine in examples
    "S603",    # subprocess usage is explicit in CLI examples
    "T201",    # examples print result snippets by design
]

[tool.taskipy.tasks]
sort-imports = "ruff check --fix --select I,F401 bioseq_dl/ tests/ examples/"
format = "task sort-imports && ruff format bioseq_dl/ tests/ examples/"
lint = "ruff check bioseq_dl/ tests/ examples/"
lint-fix = "ruff check --fix bioseq_dl/ tests/ examples/"
ty = "ty check bioseq_dl/ tests/"
pyrefly = "pyrefly check bioseq_dl/ tests/"
test = "pytest -q"
test-v = "pytest -v"
test-cov = "pytest --cov=bioseq_dl --cov-report=html"
update-fixtures = "BIOSEQ_DL_CAPTURE=1 python -m tests._capture.capture"
