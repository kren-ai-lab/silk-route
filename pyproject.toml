[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bioseqdownloader"
dynamic = ["version"]
description = "Tool to download and integrate biological data from multiple APIs (UniProt, AlphaFold, BioGRID, KEGG, etc.)"
readme = "README.md"
license = "GPL-3.0-only"
authors = [{ name = "Kren AI Lab", email = "krenai@umag.cl" }]
requires-python = ">=3.11,<3.15"

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    "pandas",
    "pyarrow",
    "tqdm",
    "requests",
    "biopython",
    "zeep",
    "python-dotenv",
    "pyyaml",
    "beautifulsoup4",
    "typer",
    "dicttoxml",
]

[project.optional-dependencies]
dev = [
    "pyrefly>=0.64",
    "ruff>=0.15",
    "taskipy>=1.14",
    "ty>=0.0.30",
]
tests = [
    "pytest>=9.0",
    "pytest-cov>=7.1",
    "responses>=0.25",
]

[project.scripts]
bioseq-dl = "bioseq_dl.cli.main:app"
bioseq-dl-init = "bioseq_dl.init_config:main_init"

[project.urls]
Homepage = "https://github.com/ProteinEngineering-PESB2/BioSeqDownloader"
Issues = "https://github.com/ProteinEngineering-PESB2/BioSeqDownloader/issues"

[tool.hatch.version]
path = "bioseq_dl/__init__.py"
pattern = '__version__ = "(?P<version>[^"]+)"'

[tool.hatch.build.targets.wheel]
packages = ["bioseq_dl"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",
    "D203",
    "D213",
    "N802",
    "N803",
    "N806",
    "PLR0913",
]

[tool.ruff.lint.per-file-ignores]
"bioseq_dl/cli/*" = [
    "B008",    # typer.Option() in function defaults is the intended pattern
    "FBT001",  # bool flags are standard in CLI functions
    "FBT002",
    "FBT003",
    "TC003",   # Path used at runtime by typer for type coercion
]
"tests/*" = [
    "ANN",
    "D",
    "EM101",
    "FBT003",
    "PLC0415",
    "PLR2004",
    "PT017",
    "S101",
    "TRY003",
]
"examples/*" = [
    "INP001",  # example scripts are intentionally standalone modules
    "PLR2004", # small referential scripts can compare against literal sizes
    "S101",    # lightweight runtime checks are fine in examples
    "S603",    # subprocess usage is explicit in CLI examples
    "T201",    # examples print result snippets by design
]

[tool.taskipy.tasks]
sort-imports = "ruff check --fix --select I,F401 bioseq_dl/ tests/ examples/"
format = "task sort-imports && ruff format bioseq_dl/ tests/ examples/"
lint = "ruff check bioseq_dl/ tests/ examples/"
lint-fix = "ruff check --fix bioseq_dl/ tests/ examples/"
ty = "ty check bioseq_dl/ tests/"
pyrefly = "pyrefly check bioseq_dl/ tests/"
test = "pytest -q"
test-v = "pytest -v"
test-cov = "pytest --cov=bioseq_dl --cov-report=html"
